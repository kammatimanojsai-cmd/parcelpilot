spring.application.name=parcelpilot
server.port=${PORT:8080}
server.shutdown=graceful
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# Time zone for cut-offs and ETAs
parcelpilot.time-zone=Asia/Kolkata
# Extra non-working days for festivals whose dates move each year, comma separated ISO dates (e.g. 2026-03-04)
parcelpilot.extra-holidays=${PARCELPILOT_EXTRA_HOLIDAYS:}
